name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: The review recipe (fast suite)
        # verbatim from the review cycle; model/net-dependent suites
        # (kitchen/overcooked, sumo) excluded exactly as locally
        run: pytest -q -m "not slow" --ignore=tests/kitchen -k "not sumo"
