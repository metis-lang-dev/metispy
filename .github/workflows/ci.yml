name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the release's own build (publish.yml, release-check s-7dc259fc), no upload:
  # a change that breaks the sdist, the wheel or its install fails here first
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metispy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the sdist and the wheel
        run: |
          python -m pip install -q build
          python -m build --outdir dist metispy
      - name: Smoke-install the wheel in a fresh venv, outside the checkout
        run: bash metispy/tools/smoke_wheel.sh dist

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # the suite expects its siblings beside it (tests/langpath.py)
      - uses: actions/checkout@v4
        with:
          path: metispy
      - name: Checkout metis-lang@master (public sibling — corpus + metisc)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - name: Checkout metis-catalog (public sibling; the catalog-reading tests)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metispy/pyproject.toml
      - name: Build metisc (stdlib-only ocamlopt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox g++
          make -C metis-lang metisc
      - name: Install
        run: pip install -e './metispy[test]'
      - name: Install metis-catalog (the catalog tests import it; it brings pyyaml)
        run: pip install -e ./metis-catalog
      - name: The review recipe (fast suite)
        # verbatim from the review cycle; kitchen/overcooked and sumo are
        # excluded exactly as locally
        working-directory: metispy
        run: |
          # the host-only gate (marker oracle: the wayplan ll2pg oracle checkout) is
          # deselected by name, never skipped silently; -rs names every skip
          echo "### host-only gate NOT run here: -m oracle (test_oracle_parity, test_ground_parity — the wayplan ll2pg oracle checkout)" >> "$GITHUB_STEP_SUMMARY"
          pytest -q -rs -m "not slow and not oracle" --ignore=tests/kitchen -k "not sumo"
