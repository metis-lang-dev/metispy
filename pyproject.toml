[build-system]
requires = ["setuptools>=77"]      # PEP 639: license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "metispy"
version = "0.1.0"
description = "The metis python referee + research kit: exact semantics, learning, the formalize harness — cross-checking the metis-lang toolchain"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Robofortis"}]
# the floor is what CI runs (ci.yml, publish.yml: 3.12); widen it with a CI matrix, not by hope
requires-python = ">=3.12"
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://metis-lang-dev.github.io"
Repository = "https://github.com/metis-lang-dev/metispy"
Issues = "https://github.com/metis-lang-dev/metispy/issues"
Compiler = "https://github.com/metis-lang-dev/metis-lang"
Catalog = "https://github.com/metis-lang-dev/metis-catalog"

[project.scripts]
metis = "metis.lang.repl:main"

[project.optional-dependencies]
sysadmin = ["pyRDDLGym", "rddlrepository"]
# CI / dev: the scoped flake rerun (CI.md D2) lives in pytest-rerunfailures;
# pyRDDLGym + rddlrepository: the slow parity gates that read RDDL (without
# them 9 of the 24 skip — the nightly slow job runs all of them)
test = ["pytest", "pytest-rerunfailures", "pyRDDLGym", "rddlrepository"]

[tool.setuptools.packages.find]
include = ["metis*"]

# the data files a package reads at run time: the domains' catalogs (the kitchen's pair
# scenes the served bundle compiles, gol, nav, sysadmin, xtraffic, fiction, road) and
# road's object table; without them a wheel install (non-editable) cannot build them
# (tests/test_package_data.py)
[tool.setuptools.package-data]
"*" = ["catalogs/*.llp", "catalogs/*/*.llp", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy parity gates (golden corpus, differential); skip in the dev loop with -m 'not slow'",
    "flaky: known-flaky (CI.md D2) — rerun ONLY on the named exception via pytest-rerunfailures; never skipped",
    "oracle: needs the wayplan ll2pg oracle checkout (tests/oracle.py) — a HOST-ONLY gate: CI deselects it by name (-m 'not oracle', said in the run's summary); METIS_ORACLE_REQUIRED=1 makes a missing oracle fail instead of skip",
]
